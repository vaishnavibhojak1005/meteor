name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meteor_admin
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: meteor_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up schema
        env:
          PGPASSWORD: ci_test_password
        run: psql -h localhost -U meteor_admin -d meteor_db -f quality_engine/schema.sql

      - name: Insert test dataset row
        env:
          PGPASSWORD: ci_test_password
        run: psql -h localhost -U meteor_admin -d meteor_db -c "INSERT INTO datasets (name, description) VALUES ('orders', 'CI test dataset');"

      - name: Generate synthetic data
        run: python scripts/generate_data.py

      - name: Generate corrupted data
        run: python scripts/corrupt_data.py

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: meteor_db
          DB_USER: meteor_admin
          DB_PASSWORD: ci_test_password
        run: python -m pytest tests/ -v